name: realtime-voice
version: 1.0.0
description: "Real-time voice chat, Microsoft Edge-TTS Thai speech synthesis, and 9Router multimodal STT for Hermes Agent."
author: "Boss (ratchanon2003) & Maymint, Hermes Agent"
license: MIT
kind: general
provides_hooks:
  - on_session_start
  - on_session_end
  - post_llm_call
provides_commands:
  - voice
provides_tools:
  - voice_speak
  - voice_transcribe
  - voice_status
config:
  default_voice: "th-TH-PremwadeeNeural"
  auto_speak: false
  speed: "+0%"
  pitch: "+0Hz"
